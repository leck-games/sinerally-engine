<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SineRally Engine</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7cc6f0;font-family:system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:env(safe-area-inset-left,0);right:env(safe-area-inset-right,0);padding:8px 14px;color:#fff;text-shadow:0 2px 0 #0006;font-weight:800;pointer-events:none;display:flex;justify-content:space-between}
#speed{font-size:28px}#race{font-size:18px;text-align:center}#dbg{font:12px monospace;white-space:pre}
#mini{position:fixed;right:max(10px,env(safe-area-inset-right));top:calc(50px + env(safe-area-inset-top,0px));border-radius:50%;border:3px solid #fff;background:#0003}
#topbtns{position:fixed;left:max(10px,env(safe-area-inset-left));top:calc(50px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.sb{background:#fff8;border:0;border-radius:10px;padding:6px 10px;font-weight:800;color:#235}
#joy{position:fixed;left:max(30px,env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:#fff3;border:3px solid #fff8;display:none}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:#fffc}
.btn{position:fixed;width:78px;height:78px;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:900;font-size:15px;display:none;align-items:center;justify-content:center;background:#0004}
#bGas{right:max(24px,env(safe-area-inset-right));bottom:30px;background:#3c4c}#bBrk{right:calc(max(24px,env(safe-area-inset-right)) + 92px);bottom:20px;background:#c44c}#bBst{right:calc(max(24px,env(safe-area-inset-right)) + 16px);bottom:122px;background:#f90c}#bDrf{right:calc(max(24px,env(safe-area-inset-right)) + 108px);bottom:112px;background:#48cc}
#gauge{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:none}
#msg{position:fixed;top:40%;width:100%;text-align:center;font-size:40px;color:#fff;font-weight:900;text-shadow:0 3px 0 #0007;pointer-events:none}
#rot{position:fixed;inset:0;background:#235;color:#fff;display:none;align-items:center;justify-content:center;font-size:22px;z-index:9}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SR Engine">
<meta name="theme-color" content="#4fb3ff"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>/* iOS home-screen */canvas{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}#allBuilds{padding:4px 8px!important;border-width:2px!important;font-size:11px!important;display:inline-block;text-decoration:none;font:900 12px "Arial Black",system-ui,sans-serif;color:#111;background:#fff;border:3px solid #111;border-radius:6px;padding:5px 9px;box-shadow:3px 3px 0 #111;-webkit-tap-highlight-color:transparent}</style>
</head><body>
<div id="hud"><div id="speed">0 km/h</div><div id="race"></div><div id="dbg"></div></div>
<canvas id="mini" width="130" height="130"></canvas>
<div id="topbtns"><button class="sb" id="tReset">⟲ R</button><button class="sb" id="tTilt">Tilt: off</button><button class="sb" id="tDbg">FPS</button><a id="allBuilds" href="https://leck-games.github.io/">‹ ALL BUILDS</a></div>
<div id="joy"><div id="knob"></div></div>
<div class="btn" id="bGas">GAS</div><div class="btn" id="bBrk">BRAKE</div><div class="btn" id="bBst">BOOST</div><div class="btn" id="bDrf">DRIFT</div>
<canvas id="gauge" width="200" height="120"></canvas>
<div id="msg"></div><div id="rot">Rotate to landscape ↻</div>
<script type="importmap">{"imports":{"three":"./js/three.module.js"}}</script>
<script type="module" src="js/main.js"></script>
</body></html>
